<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>ClinicDesk Health</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="orbit" aria-hidden="true"></div>
  <header class="top">
    <a class="brand" href="/" style="text-decoration:none;color:inherit">
      <span class="mark">+</span>
      <div>
        <p class="eyebrow">Agent Arena</p>
        <h1>Health</h1>
      </div>
    </a>
    <div class="top-actions">
      <button id="theme" class="theme-btn" type="button" aria-label="Switch to light theme" title="Light mode">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 13.5A7 7 0 1 1 10.5 7a5.5 5.5 0 0 0 6 6.5z"/></svg>
      </button>
      <a class="ghost" href="/">Desk</a>
      <a class="ghost" href="/docs">API</a>
      <a class="doc-link top-doc" href="/health-raw" target="_blank" rel="noopener noreferrer">Health snapshot</a>
    </div>
  </header>
  <p class="lede">Live desk status — one full-width card per check. Open the
    <a class="doc-link" href="/health-raw" target="_blank" rel="noopener noreferrer">health snapshot</a>,
    the <a class="doc-link" href="/manifest" target="_blank" rel="noopener noreferrer">Arena manifest</a>,
    or the <a class="doc-link" href="/openapi" target="_blank" rel="noopener noreferrer">OpenAPI contract</a>
    (JSON on a clean blank page).
  </p>
  <div class="stat-grid" id="cards" aria-live="polite">
    <article class="stat"><span>Status</span><strong>Loading…</strong></article>
  </div>
  <script src="/static/theme.js"></script>
  <script>
    function card(label, value, tone){
      const klass = tone ? 'stat '+tone : 'stat';
      return '<article class="'+klass+'"><span>'+label+'</span><strong>'+(value||'—')+'</strong></article>';
    }
    function paint(data){
      const ready = Object.entries(data.providers_ready||{}).filter(([,ok])=>ok).map(([name])=>name).join(', ')||'none yet';
      const models = (data.models||[]).filter(name=>name!=='unconfigured').join(', ')||'none yet';
      const ok = data.status==='ok';
      document.getElementById('cards').innerHTML = [
        card('Status', ok?'Running':'Not running', ok?'is-ok':'is-bad'),
        card('Desk name', data.agent),
        card('What it does', 'Practice campus clinic visits'),
        card('Ready?', data.implementation==='complete'?'Yes':'Not yet', data.implementation==='complete'?'is-ok':''),
        card('Default answerer', data.default_model),
        card('Ready services', ready),
        card('Answer options', models),
        card('Jobs running now', String((data.limits||{}).concurrent ?? '0'))
      ].join('');
    }
    async function loadHealth(tries){
      // Render Free sleeps after idle; first /health can fail until the service wakes.
      for(let i=0;i<tries;i++){
        try{
          const r = await fetch('/health', {cache:'no-store'});
          if(!r.ok) throw new Error('bad status '+r.status);
          paint(await r.json());
          return;
        }catch(err){
          const msg = i===0 ? 'Starting…' : ('Waking Render… try '+(i+1)+'/'+tries);
          document.getElementById('cards').innerHTML = card('Status', msg, '');
          await new Promise(resolve=>setTimeout(resolve, 900));
        }
      }
      document.getElementById('cards').innerHTML = [
        card('Status', 'offline', 'is-bad'),
        card('Hint', 'Refresh once — Render Free may still be waking up')
      ].join('');
    }
    if(window.__HEALTH__){
      paint(window.__HEALTH__);
    }else{
      loadHealth(20);
    }
  </script>
</body>
</html>
