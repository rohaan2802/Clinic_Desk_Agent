<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JSON view</title>
  <style>
    :root{color-scheme:dark}
    html,body{margin:0;min-height:100%;background:#070c0d;color:#eef8f5;font:18px/1.55 Sora,system-ui,sans-serif}
    .wrap{max-width:980px;margin:0 auto;padding:28px 22px 48px}
    .eyebrow{margin:0 0 6px;color:#3de0c5;letter-spacing:.12em;text-transform:uppercase;font-size:13px;font-weight:700}
    h1{margin:0 0 8px;font-size:clamp(28px,5vw,40px);letter-spacing:-.03em}
    .sub{margin:0 0 22px;color:#9fb8b2;font-size:16px}
    .panel{
      margin:0;padding:22px 24px;border-radius:18px;border:1px solid #1d3a40;
      background:#10242b;box-shadow:0 18px 40px #0006;
      font:16px/1.55 ui-monospace,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;
      color:#f4fffb;
    }
    .err{color:#f3c16b}
    a.doc-link{color:#4ea1ff;text-decoration:underline;text-underline-offset:3px}
  </style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow" id="eyebrow">ClinicDesk</p>
    <h1 id="heading">Loading…</h1>
    <p class="sub" id="sub">Structured JSON view</p>
    <pre class="panel" id="json">Loading…</pre>
  </div>
  <script>
    const params=new URLSearchParams(location.search);
    const src=params.get('src')||'/health';
    const title=params.get('title')||'JSON document';
    const sub=params.get('sub')||'Pretty-printed machine contract';
    document.title=title+' · ClinicDesk';
    document.getElementById('heading').textContent=title;
    document.getElementById('sub').textContent=sub;
    fetch(src)
      .then(r=>{
        if(!r.ok)throw Error('HTTP '+r.status);
        return r.json();
      })
      .then(data=>{
        document.getElementById('json').textContent=JSON.stringify(data,null,2);
      })
      .catch(err=>{
        const el=document.getElementById('json');
        el.classList.add('err');
        el.textContent='Could not load this document.\n'+String(err&&err.message||err);
      });
  </script>
</body>
</html>
